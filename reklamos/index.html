<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reklamos Studija</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: white app frame — icon sidebar (nav, Create, history, brand switcher) beside a soft grey rounded stage holding white cards; editors open as large modals. */
:root{
  --page:#FFFFFF; --stage:#F3F3F6; --card:#FFFFFF; --soft:#F6F6F9; --ink:#141418; --muted:#6B6B76; --faint:#A6A6B0; --line:#E7E7ED;
  --grad:linear-gradient(90deg,#7C6BF2 0%,#D46BB5 55%,#F39A5A 100%);
  --accent:#6A58E2; --accent-soft:#EFEDFD;
  --ok:#2C9A60; --ok-soft:#E8F6EE; --bad:#D4405C; --bad-soft:#FDEDF0; --info:#3A6CDB; --info-soft:#EAF0FD; --draft:#6B6B76; --draft-soft:#F1F1F4;
  --shadow:0 1px 2px rgba(20,20,40,.05),0 8px 24px rgba(20,20,40,.06);
  --f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0F0F12; --stage:#17171C; --card:#1F1F26; --soft:#26262E; --ink:#EDEDF2; --muted:#A3A3AF; --faint:#6F6F7B; --line:#2D2D36;
  --accent:#A597FF; --accent-soft:#29253F;
  --ok:#5CC88E; --ok-soft:#163226; --bad:#F27D93; --bad-soft:#3C1C25; --info:#80A6FF; --info-soft:#1B2945; --draft:#A3A3AF; --draft-soft:#2A2A33;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --page:#0F0F12; --stage:#17171C; --card:#1F1F26; --soft:#26262E; --ink:#EDEDF2; --muted:#A3A3AF; --faint:#6F6F7B; --line:#2D2D36;
  --accent:#A597FF; --accent-soft:#29253F;
  --ok:#5CC88E; --ok-soft:#163226; --bad:#F27D93; --bad-soft:#3C1C25; --info:#80A6FF; --info-soft:#1B2945; --draft:#A3A3AF; --draft-soft:#2A2A33;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font:15px/1.5 var(--f);margin:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(26px,3vw,34px);font-weight:800;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
h2{font-size:19px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:16px;font-weight:700;line-height:1.3}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100%;padding-right:max(0px,env(safe-area-inset-right,0px))}
.app.collapsed{grid-template-columns:86px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding-block:16px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;overflow-y:auto;background:var(--page)}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 12px}
.logo{font-weight:800;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;color:#fff;font-style:normal;flex:none}
.iconbtn{all:unset;cursor:pointer;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--soft);color:var(--ink)}
.iconbtn:focus-visible{outline:2px solid var(--accent)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:13px;padding:10px 12px;border-radius:14px;font-weight:600;font-size:15.5px;color:var(--ink);white-space:nowrap}
.nav button:hover{background:var(--soft)}
.nav button[aria-current="page"]{background:var(--soft)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .badge{margin-left:auto;display:flex}
.cta{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--grad);color:#fff;border-radius:99px;padding:13px 20px;font-weight:700;font-size:15.5px;box-shadow:0 8px 20px rgba(212,107,181,.28);white-space:nowrap;text-align:center}
.cta:hover{filter:brightness(1.05)}
.cta:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.cta.sm{padding:10px 16px;font-size:14.5px}
.cta[disabled]{opacity:.55;cursor:default}
.side .cta{margin:14px 0 10px}
.hist-h{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 4px;color:var(--muted);font-weight:600;font-size:14px}
.hist{display:flex;flex-direction:column;gap:1px;flex:1;min-height:60px;overflow-y:auto}
.hist button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;font-size:14.5px;min-width:0}
.hist button:hover,.hist button[aria-current="page"]{background:var(--soft)}
.hist button:focus-visible{outline:2px solid var(--accent)}
.hist span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hist .ti{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.hist-empty{padding:6px 12px;color:var(--faint);font-size:13.5px}
.side-bottom{display:flex;flex-direction:column;gap:10px;padding-top:10px;position:relative}
.bsw{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:20px;padding:8px 12px 8px 8px;min-width:0}
.bsw:focus-visible{outline:2px solid var(--accent)}
.bsw b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;overflow:hidden;flex:none;border:2px solid var(--line)}
.avatar img{width:100%;height:100%;object-fit:contain;background:#fff}
.foot{display:flex;justify-content:space-around}
.bmenu{position:absolute;bottom:calc(100% - 2px);left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.14);padding:6px;display:flex;flex-direction:column;gap:2px;z-index:5}
.bmenu button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;font-weight:600;font-size:14.5px}
.bmenu button:hover{background:var(--soft)}
.bmenu button:focus-visible{outline:2px solid var(--accent)}
.bmenu .avatar{width:30px;height:30px;font-size:12px}
.app.collapsed .lbl-c,.app.collapsed .hist-h,.app.collapsed .hist,.app.collapsed .bsw b,.app.collapsed .bsw .chev,.app.collapsed .logo span{display:none}
.app.collapsed .nav button{justify-content:center;padding:11px}
.app.collapsed .side .cta{padding:13px;border-radius:50%;width:22px;height:22px;align-self:center}
.app.collapsed .bsw{justify-content:center;border:0;padding:0}
.app.collapsed .foot{flex-direction:column;align-items:center;gap:4px}
.app.collapsed .side-top{flex-direction:column;gap:8px}

.stage{background:var(--stage);border-radius:30px;margin:12px 12px 12px 0;padding-block:34px 70px;padding-left:clamp(18px,4vw,52px);padding-right:clamp(18px,4vw,52px);min-width:0;min-height:calc(100vh - 24px)}
.page{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.phead{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;justify-content:space-between}
.phead .sub{margin-top:8px;max-width:62ch}
.topbar{display:none}
.scrim{display:none}

.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:22px;min-width:0}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 15px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--faint)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.sm{padding:6px 12px;font-size:13.5px}
.btn.danger{color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13.5px;white-space:nowrap}
.chip:hover{border-color:var(--faint)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--accent)}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.lbl{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=url],input[type=password],input[type=date],input[type=time],select,textarea{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 13px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
input[type=color]{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:4px;cursor:pointer}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.note{font-size:14px;padding:12px 14px;border-radius:14px;background:var(--accent-soft)}
.note.err{background:var(--bad-soft);color:var(--bad)}
.empty{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:44px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.empty .big{width:62px;height:62px;border-radius:20px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.empty p{max-width:46ch}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;animation:pulse 1.1s ease-in-out infinite;flex:none}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.dot,.spin{animation:none}}
.tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.textbox{background:var(--soft);border-radius:14px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;font-size:14.5px}
.prompt{font:12.5px/1.55 var(--mono);background:var(--soft);border-radius:12px;padding:12px;white-space:pre-wrap;word-break:break-word;max-height:200px;overflow:auto}
details summary{cursor:pointer;font-weight:600;font-size:14px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:14px}
.link:focus-visible{outline:2px solid var(--accent)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:20px}
.tile{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-width:0}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:18px}
.thumb{position:relative;border-radius:18px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);aspect-ratio:4/5;transition:transform .15s}
.tile:hover .thumb{transform:translateY(-3px)}
@media (prefers-reduced-motion:reduce){.thumb{transition:none}}
.thumb canvas,.pthumb canvas,.wthumb canvas,.rthumb canvas{width:100%;height:100%;object-fit:cover;display:block}
.tmeta{display:flex;flex-direction:column;gap:2px}
.tmeta b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:700;font-size:14.5px;line-height:1.35}
.tmeta span{font-size:13px;color:var(--muted)}
.ov{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.ov span{background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:700;display:flex;gap:7px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.stpill{position:absolute;top:10px;left:10px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--st-soft);color:var(--st)}

.st-draft{--st:var(--draft);--st-soft:var(--draft-soft)}
.st-approval{--st:var(--bad);--st-soft:var(--bad-soft)}
.st-scheduled{--st:var(--info);--st-soft:var(--info-soft)}
.st-published{--st:var(--ok);--st-soft:var(--ok-soft)}
.chs{display:flex}
.ch{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:800;color:#fff;border:2px solid #fff;margin-right:-5px;letter-spacing:-.02em}
.ch.ig{background:#D23D78}.ch.fb{background:#2F6FE4}.ch.li{background:#1F5A8C}.ch.tt{background:#222226}

.calbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.calbar .mlabel{font-weight:700;font-size:17px;margin-left:6px}
.circ{all:unset;cursor:pointer;width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow)}
.circ:focus-visible{outline:2px solid var(--accent)}
.pillbtn{all:unset;cursor:pointer;background:var(--card);border-radius:99px;padding:10px 18px;font-weight:600;box-shadow:var(--shadow)}
.pillbtn:focus-visible{outline:2px solid var(--accent)}
.cal{background:var(--card);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-head div{padding:14px 16px;font-size:12px;letter-spacing:.12em;font-weight:600;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--line)}
.day{min-height:170px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;position:relative}
.day:nth-child(7n){border-right:0}
.day.out{background:var(--soft)}
.day.drop{background:var(--accent-soft)}
.dnum{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;color:var(--faint)}
.day:not(.out):not(.past) .dnum{color:var(--ink)}
.day.today .dnum{color:var(--muted)}
.day.today .dnum b{background:var(--ink);color:var(--card);border-radius:99px;min-width:28px;height:28px;display:grid;place-items:center;font-size:13.5px}
.addday{all:unset;cursor:pointer;align-self:center;color:var(--muted);font-weight:600;font-size:13.5px;padding:4px 10px;border-radius:99px;opacity:0}
.day:hover .addday,.addday:focus-visible,.day.today .addday{opacity:1}
.addday:hover{background:var(--soft);color:var(--ink)}
@media (hover:none){.addday{opacity:1}}
.pc{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:16px;background:var(--st-soft)}
.pc:focus-visible{outline:2px solid var(--accent)}
.pc .pst{font-size:12.5px;font-weight:600;text-align:center;color:var(--st);padding-top:2px}
.pthumb{position:relative;border-radius:11px;overflow:hidden;aspect-ratio:4/5;background:var(--card);display:block}
.pmeta{position:absolute;left:6px;right:6px;top:6px;display:flex;align-items:center}
.time{margin-left:auto;background:rgba(255,255,255,.94);color:#141418;border-radius:99px;padding:2px 8px;font-size:12px;font-weight:700}
.tray{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.tray.drop{background:var(--accent-soft)}
.tray-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.agenda{display:flex;flex-direction:column;gap:18px}
.dayrow{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px}
.dayrow .dl{font-weight:700;padding-top:6px}
.dayrow .dl span{display:block;font-weight:500;color:var(--muted);font-size:13px}
.dayrow .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}

.hero{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px}
.composer{border:1.5px solid var(--line);border-radius:22px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;background:var(--card)}
.composer textarea{border:0;background:transparent;padding:6px;font-size:16px;resize:none}
.composer textarea:focus{outline:none}
.composer:focus-within{border-color:var(--accent)}
.cbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.cbar .cta{margin-left:auto}
.dnacard{display:flex;flex-direction:column;gap:16px;justify-content:center}
.dnarow{display:flex;gap:16px;align-items:center}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.wday{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px;min-width:0}
.wday.today{outline:2px solid var(--ink)}
.wday.drop{background:var(--accent-soft)}
.wh{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between}
.wh b{color:var(--ink);font-size:14px;letter-spacing:0}
.wthumb{all:unset;cursor:pointer;display:block;border-radius:10px;overflow:hidden;aspect-ratio:5/4;position:relative}
.wthumb:focus-visible{outline:2px solid var(--accent)}
.wadd{all:unset;cursor:pointer;margin-top:auto;text-align:center;color:var(--faint);font-weight:600;font-size:13px;padding:6px;border-radius:10px}
.wadd:hover{background:var(--soft);color:var(--ink)}
.wadd:focus-visible{outline:2px solid var(--accent)}
.recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px}
.rcard{all:unset;cursor:pointer;background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.rcard:focus-visible{outline:2px solid var(--accent)}
.rthumb{aspect-ratio:16/10;background:var(--soft);position:relative;display:grid;place-items:center;color:var(--accent);overflow:hidden}
.rmeta{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.rmeta b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmeta span{font-size:13px;color:var(--muted)}

.rows{background:var(--card);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.rowi{all:unset;cursor:pointer;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);box-sizing:border-box}
.rowi:last-child{border-bottom:0}
.rowi:hover{background:var(--soft)}
.rowi:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ri{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.rowi b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowi .s{display:block;color:var(--muted);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:18px;align-items:start}
.cards .card{display:flex;flex-direction:column;gap:12px}
.scenes{width:100%;border-collapse:collapse;font-size:13.5px}
.scenes th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
.scenes td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tablewrap{overflow-x:auto}

.modal{position:fixed;inset:0;z-index:40;background:rgba(14,14,24,.5);display:grid;place-items:center;padding-block:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
.pubbox{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:16px}
.publine{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.4}
.publine .ch{flex:none;margin-right:0}
span.ch.ig{width:24px;border-radius:50%;box-shadow:none;color:#fff;font-size:9.5px;line-height:1;overflow:visible}
.publine.ok{color:var(--ok)}
.publine.err{color:var(--bad)}
.publine a{color:inherit;font-weight:600}
.msteps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.msteps code{font-size:12px;background:var(--soft);padding:1px 5px;border-radius:5px;word-break:break-word}
.metaok{display:flex;gap:8px;align-items:center;font-size:14px}
.metaok svg{color:var(--ok)}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-weight:600;text-decoration:underline}
.linkbtn:focus-visible{outline:2px solid var(--accent)}
.vstage{gap:14px}
#vcv{display:block;max-width:100%;max-height:min(60vh,620px);width:auto;height:auto;border-radius:14px;background:#000;box-shadow:0 2px 6px rgba(0,0,0,.12),0 14px 34px rgba(0,0,0,.18)}
.vctrl{display:flex;gap:10px;align-items:center;width:100%}
.vctrl input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.vscenes{display:flex;flex-direction:column;gap:10px}
.vscene{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;padding:12px;border:1px solid var(--line);border-radius:16px}
.vthumb{all:unset;cursor:pointer;width:76px;aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:var(--soft);display:grid;place-items:center;position:relative;color:var(--muted)}
.vthumb:focus-visible{outline:2px solid var(--accent)}
.vthumb img,.vthumb video{width:100%;height:100%;object-fit:cover;display:block}
.vthumb .spin{position:absolute}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px}
.vstrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.vstrip img{width:54px;aspect-ratio:9/16;object-fit:cover;border-radius:8px;flex:none;background:var(--soft)}
.briefs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.brief-card{border:1.5px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.brief-card:hover{border-color:var(--accent)}
.brief-card h3{font-size:15px}
.brief-card p{font-size:13.5px}
.brief-card .why{font-size:12.5px;color:var(--muted)}
.brief-card .chips .chip{cursor:default;font-size:12px;padding:4px 10px}
.aibar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ig{width:min(440px,100%);background:#fff;color:#111;border-radius:22px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.08),0 18px 40px rgba(0,0,0,.14);font:14px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
.ig-head{display:flex;align-items:center;gap:10px;padding:12px 14px}
.ig-head .avatar{display:grid;width:34px;height:34px;font-size:12px;border-width:1px;color:#fff}
.ig-head b{display:block;font-size:14px}
.ig-head span{display:block;font-size:12px;color:#737373}
.ig-img{position:relative;background:#f2f2f2}
.ig-img canvas{display:block;width:100%;height:auto;max-height:min(58vh,560px);object-fit:contain;background:#f2f2f2}
.ig-cta{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:#f2f4f7;font-weight:600;border-bottom:1px solid #e6e6e6}
.ig-icons{display:flex;gap:16px;padding:10px 14px 4px;align-items:center}
.ig-icons svg{width:24px;height:24px}
.ig-icons .sp{flex:1}
.ig-likes{padding:0 14px;font-size:13.5px;font-weight:600}
.ig-cap{padding:4px 14px 14px;white-space:pre-wrap;word-break:break-word}
.ig-cap b{margin-right:4px}
.ig-cap button{all:unset;cursor:pointer;color:#737373}
.ig-cap button:focus-visible{outline:2px solid var(--accent)}
.mbox{background:var(--card);border-radius:28px;width:min(1140px,100%);max-height:100%;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.28);display:flex;flex-direction:column;outline:none}
.mbox.sm{width:min(560px,100%)}
.mbox.md{width:min(860px,100%)}
.mhead{display:flex;align-items:center;gap:8px;padding:16px 18px 16px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:3}
.mhead h2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbody{padding:22px 24px 24px;display:flex;flex-direction:column;gap:18px}
.mfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 24px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card);z-index:3}
.mfoot .sp{flex:1}
.ed{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:26px;align-items:start}
.edstage{background:var(--stage);border-radius:22px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:12px;position:sticky;top:84px}
.edstage.drag{outline:2px dashed var(--accent);outline-offset:-8px}
.edcv{position:relative;display:inline-block;max-width:100%}
.edcv canvas{display:block;max-width:100%;max-height:min(60vh,620px);width:auto;height:auto;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.12),0 14px 34px rgba(0,0,0,.14)}
.fmt{font:500 11.5px var(--mono);color:var(--muted)}
.edside{display:flex;flex-direction:column;gap:18px;min-width:0}
.edsec{display:flex;flex-direction:column;gap:10px}
.edsec+.edsec{border-top:1px solid var(--line);padding-top:16px}
.picks{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pick{all:unset;cursor:pointer;width:54px;height:54px;border-radius:12px;border:2px solid transparent;overflow:hidden;background:var(--soft);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--muted);box-sizing:border-box;position:relative}
.pick.wide{width:auto;padding:0 14px;color:var(--ink)}
.pick img{width:100%;height:100%;object-fit:cover}
.pick[aria-pressed="true"]{border-color:var(--accent)}
.pick:focus-visible,.pick:focus-within{outline:2px solid var(--accent)}
.up input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.type{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.type:hover{border-color:var(--faint)}
.type:focus-visible{outline:2px solid var(--accent)}
.type .ti{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.type b{font-size:16px}
.type span{color:var(--muted);font-size:13.5px}
.progress{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:40px 10px}
.progress .ring{width:64px;height:64px;border-radius:50%;background:conic-gradient(from 0deg,#7C6BF2,#D46BB5,#F39A5A,#7C6BF2);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));animation:sp 1.2s linear infinite}
@media (prefers-reduced-motion:reduce){.progress .ring{animation:none}}
.plan{background:var(--soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.plan input[type=date],.plan input[type=time],.plan select{background:var(--card)}
.check{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
iframe.mail{width:100%;height:560px;border:0;border-radius:16px;background:#fff;box-shadow:var(--shadow)}
.subjects{display:flex;flex-direction:column;gap:6px}
.subjects div{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--soft);border-radius:12px;padding:8px 8px 8px 12px}
.subjects span{min-width:0;overflow-wrap:anywhere;font-size:14px}

.dna{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:20px;align-items:start}
.dna .card{display:flex;flex-direction:column;gap:14px}
.dna-col{display:flex;flex-direction:column;gap:20px;min-width:0}
.colors{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.colors label{font-size:12px;color:var(--muted);font-weight:600}
.shots{display:flex;flex-wrap:wrap;gap:8px}
.shot{position:relative;width:78px;height:78px;border-radius:14px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.shot img{width:100%;height:100%;object-fit:cover}
.shot.logo img{object-fit:contain;background:#fff}
.shot button{all:unset;cursor:pointer;position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.addtile{position:relative;width:78px;height:78px;border-radius:14px;border:1.5px dashed var(--faint);display:grid;place-items:center;color:var(--muted);cursor:pointer}
.addtile:focus-within{outline:2px solid var(--accent)}
.idcard{border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.idtop{padding:20px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.idbar{display:flex;height:30px}
.idbar span{flex:1}
.saved{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}

#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1100px){
  .hero,.dna,.ed{grid-template-columns:minmax(0,1fr)}
  .edstage{position:static}
  .week{grid-template-columns:repeat(7,minmax(120px,1fr));overflow-x:auto;padding-bottom:6px}
}
@media (max-width:900px){
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--page)}
  .app,.app.collapsed{grid-template-columns:minmax(0,1fr);padding-right:0}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.2);padding-top:max(16px,env(safe-area-inset-top,0px));visibility:hidden}
  .app.nav-open .side{transform:none;visibility:visible}
  .app.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
  .app.collapsed .lbl-c,.app.collapsed .hist-h,.app.collapsed .bsw b,.app.collapsed .logo span{display:revert}
  .app.collapsed .hist{display:flex}
  .app.collapsed .nav button{justify-content:flex-start;padding:10px 12px}
  .app.collapsed .side .cta{width:auto;height:auto;border-radius:99px;align-self:stretch}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;align-items:center;gap:10px;background:var(--page);padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .topbar .logo{flex:1}
  .stage{margin:0;border-radius:24px 24px 0 0;padding-block:24px 70px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .collapse-btn{display:none!important}
}
@media (max-width:640px){
  .modal{padding:0}
  .mbox,.mbox.sm,.mbox.md{border-radius:0;height:100%;max-height:100%}
  .colors{grid-template-columns:repeat(3,minmax(0,1fr))}
  .dayrow{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  iframe.mail{height:440px}
}

  if (Store.mode === 'idb') { try { (await DB.all('files')).forEach(f => FILES.set(f.id, URL.createObjectURL(f.blob))); } catch {} }
  let brands = await Store.list('brands');
  if (!brands.length && !LS.get('seeded', false)) { for (const b of SEED_BRANDS) await Store.put('brands', b); brands = SEED_BRANDS.map(clone); LS.set('seeded', true); }
  const creations = await Store.list('creations');
  S.brands = brands.map(b => Object.assign({ artStyle: 'editorial', photos: [], fonts: {} }, b, { colors: Object.assign({}, b.colors || {}) })).sort((a, b) => (a.updatedAt || 0) - (b.updatedAt || 0));
  S.creations = creations.filter(c => c && arr(c.items).length);
  reindex();
  if (!S.brands.some(b => b.id === S.brandId)) S.brandId = S.brands[0] ? S.brands[0].id : null;
  if (!LS.get('v8', 0)) { ['ads', 'social'].forEach(tp => { const sv = LS.get('brief_' + tp, null); if (sv && sv.mode) { delete sv.mode; LS.set('brief_' + tp, sv); } }); LS.set('v8', 1); }
  S.loaded = true; render(); setTimeout(pubTick, 4000);
  if (!AI.ready()) setTimeout(() => { if (!S.modal) { S.modal = { type: 'settings' }; renderModal(true); } }, 400);
})();
})();
</script>
